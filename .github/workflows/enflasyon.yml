# Monthly TÜFE update for the Kirpi app (data/enflasyon.json). TÜİK announces on the 3rd at
# 10:00 TR (07:00 UTC), or the next working day — so we check on days 3–10, twice a day; the
# script does nothing once the month is in. Can also be run by hand (Actions → Run workflow).
name: Enflasyon verisi
on:
  schedule:
    - cron: '20 7 3-10 * *'
    - cron: '30 10 3-10 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'update or discover (list EVDS series)'
        default: update
      what:
        description: 'discover: category id or data group code (empty = categories)'
        default: ''
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TÜFE from EVDS
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
          TUFE_SERIES: ${{ vars.TUFE_SERIES }}
          TUFE_OLD_SERIES: ${{ vars.TUFE_OLD_SERIES }}
          DISCOVER: ${{ github.event.inputs.what }}
        run: node scripts/enflasyon.mjs ${{ github.event.inputs.mode == 'discover' && 'discover' || '' }}
      - name: Commit if changed
        if: github.event.inputs.mode != 'discover'
        run: |
          if git diff --quiet data/enflasyon.json; then echo "no change"; exit 0; fi
          git config user.name "kirpi-bot"
          git config user.email "support@kirpiasistan.com"
          git commit -am "Enflasyon verisi: $(node -p "require('./data/enflasyon.json').period")"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
